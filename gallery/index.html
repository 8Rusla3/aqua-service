<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="refresh" content="0; url=../gallery.html" />
    <title>Redirecting to Aqua Service Gallery</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Redirecting to the Aqua Service Inc project gallery for Toronto and GTA waterproofing, drain, and renovation work."
    />
    <meta name="theme-color" content="#1d9bf0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <div class="page">
      <header role="banner">
        <div class="nav">
          <a
            href="/index.html"
            class="logo"
            aria-label="Aqua Service Inc - Home"
          >
            <img
              src="../images/aqua-service-inc.jpg"
              alt="Aqua Service Inc Logo"
              class="logo-mark"
              decoding="async"
            />
            <div class="logo-text">
              <span>Aqua Service Inc</span>
              <span>Toronto Drain & Waterproofing Experts</span>
            </div>
          </a>
        </div>
      </header>

      <main>
        <section class="section hero" id="top">
          <div class="section-inner hero-grid">
            <div class="hero-content">
              <div class="hero-badge">
                <span class="hero-badge-dot"></span>
                Redirecting to project gallery
              </div>
              <h1 class="hero-title">
                Project gallery is loading.
                <span>Please wait a moment.</span>
              </h1>
              <p class="hero-subtitle">
                You are being redirected to the complete project showcase for
                Toronto waterproofing, drain repair, and renovation work.
              </p>

              <div class="hero-cta-row">
                <a href="../gallery.html" class="btn btn-primary"
                  >Open Gallery</a
                >
                <a href="/index.html" class="btn btn-ghost">Back to Home</a>
              </div>
            </div>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
